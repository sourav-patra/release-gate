name: publish-pypi

# Reusable. A caller repository triggers it on push of a v* tag:
#   jobs:
#     publish:
#       uses: OWNER/release-gate/.github/workflows/publish-pypi.yml@<full sha>
#       with:
#         gate-app-slug: <slug of the gate App>
#       permissions: {contents: read, checks: read, id-token: write}
on:
  workflow_call:
    inputs:
      gate-app-slug:
        description: "app.slug of the gate App that must own the release-gate check"
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: "3.12"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches the package version
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + ver:
              sys.exit("tag %s does not equal v%s" % (tag, ver))
          PY

      - name: Tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --quiet origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: release-gate check succeeded and came from the gate App
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ inputs.gate-app-slug }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=release-gate" \
            --jq "[.check_runs[] | select(.conclusion == \"success\" and .app.slug == \"$APP_SLUG\")] | length")
          [ "$n" -ge 1 ] || { echo "no successful release-gate check from $APP_SLUG"; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The owner sets tag rule v* and a required reviewer on this
    # environment, so the upload waits for the owner's approval click.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
