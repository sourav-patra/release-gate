name: gate

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "OWNER/NAME to gate (empty: scan every installed repository)"
        required: false
        default: ""
      sha:
        description: "Commit to gate (needs repo)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The owner restricts this environment to branch main and holds
    # NEEDLES, ACCEPTED, GATE_APP_ID and GATE_APP_KEY in it.
    environment: needles
    permissions:
      contents: read
    steps:
      - name: Check out the gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the gate App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Write private lists and mask every line
        env:
          NEEDLES: ${{ secrets.NEEDLES }}
          ACCEPTED: ${{ secrets.ACCEPTED }}
        run: |
          umask 077
          printf '%s\n' "$NEEDLES" > "$RUNNER_TEMP/needles.txt"
          printf '%s\n' "$ACCEPTED" > "$RUNNER_TEMP/accepted.txt"
          chmod 600 "$RUNNER_TEMP/needles.txt" "$RUNNER_TEMP/accepted.txt"
          for f in needles accepted; do
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done < "$RUNNER_TEMP/$f.txt"
          done
          true

      - name: Gate unchecked pull request heads and v* tags
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEEDLES_FILE: ${{ runner.temp }}/needles.txt
          ACCEPTED_FILE: ${{ runner.temp }}/accepted.txt
          IN_REPO: ${{ inputs.repo }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          python3 gate/scan_repos.py --repo "$IN_REPO" --sha "$IN_SHA"

      - name: Remove private lists
        if: always()
        run: rm -f "$RUNNER_TEMP/needles.txt" "$RUNNER_TEMP/accepted.txt"
